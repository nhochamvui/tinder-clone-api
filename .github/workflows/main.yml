# Deploy the ASP.NET Core API to Render via its deploy hook.
# Requires a secret: RENDER_DEPLOY_HOOK_URL
# (Render dashboard -> service -> Settings -> Deploy Hook -> Create)

name: Deploy API to Render

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
